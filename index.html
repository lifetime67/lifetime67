<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счетчик жизни</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --accent: #38bdf8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1000px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .label {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .value {
            font-size: 1.8rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>

    <h1>ВРЕМЯ В ПУТИ</h1>

    <div class="container">
        <div class="stat-card">
            <div class="label">Лет</div>
            <div id="years" class="value">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Месяцев</div>
            <div id="months" class="value">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Недель</div>
            <div id="weeks" class="value">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Дней</div>
            <div id="days" class="value">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Часов</div>
            <div id="hours" class="value">0</div>
        </div>
        <div class="stat-card">
            <div class="label">Минут</div>
            <div id="minutes" class="value">0</div>
        </div>
        <div class="stat-card" style="grid-column: 1 / -1; border: 1px solid var(--accent);">
            <div class="label">Секунд</div>
            <div id="seconds" class="value" style="color: var(--accent);">0</div>
        </div>
    </div>

    <script>
        // Установка целевой даты: 9 июля 2007, 11:45 (UTC+3)
        // В JS месяцы начинаются с 0, поэтому июль — это 6.
        // Чтобы учесть UTC+3, мы создаем дату в формате ISO или через Date.UTC
        const startDate = new Date(Date.UTC(2007, 6, 9, 8, 45, 0)); 

        function updateCounter() {
            const now = new Date();
            const diffInMs = now - startDate;

            // Расчеты
            const seconds = Math.floor(diffInMs / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);
            const weeks = Math.floor(days / 7);
            
            // Приблизительный расчет месяцев и лет
            const years = Math.floor(days / 365.25);
            const months = Math.floor(days / 30.4375);

            // Вывод на экран с форматированием (добавление пробелов в числах)
            document.getElementById('seconds').textContent = seconds.toLocaleString('ru-RU');
            document.getElementById('minutes').textContent = minutes.toLocaleString('ru-RU');
            document.getElementById('hours').textContent = hours.toLocaleString('ru-RU');
            document.getElementById('days').textContent = days.toLocaleString('ru-RU');
            document.getElementById('weeks').textContent = weeks.toLocaleString('ru-RU');
            document.getElementById('months').textContent = months.toLocaleString('ru-RU');
            document.getElementById('years').textContent = years.toLocaleString('ru-RU');
        }

        // Обновление каждую секунду
        setInterval(updateCounter, 1000);
        updateCounter(); // Инициализация при загрузке
    </script>
</body>
</html>
