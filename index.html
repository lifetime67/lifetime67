<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Tracker</title>
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --accent: #38bdf8;
            --target-color: #94a3b8;
            --date-color: #fbbf24;
            --anna-accent: #f472b6; /* Розовый акцент для Анны */
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        /* Часы */
        .moscow-clock {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 20px;
            border: 1px solid #334155;
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
        }
        .moscow-clock .time { font-size: 1.8rem; font-weight: bold; color: var(--text-main); display: block; }

        /* Переключатель вкладок */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 500px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: var(--card-bg);
            color: var(--target-color);
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            font-size: 1rem;
        }
        .tab-btn.active[data-user="artem"] { background: var(--accent); color: white; }
        .tab-btn.active[data-user="anna"] { background: var(--anna-accent); color: white; }

        /* Контейнер карточек */
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 18px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border 0.3s;
        }

        .row-main { display: flex; justify-content: space-between; align-items: center; }
        .label { font-size: 0.8rem; text-transform: uppercase; color: var(--target-color); font-weight: 600; }
        .value { font-size: 1.5rem; font-weight: bold; font-variant-numeric: tabular-nums; }

        .progress-bar-bg { width: 100%; height: 6px; background: #334155; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; transition: width 0.5s ease; }

        /* Цвета полосок зависят от активного пользователя */
        .user-artem .progress-fill { background: var(--accent); }
        .user-anna .progress-fill { background: var(--anna-accent); }
        .user-artem .highlight { border-left: 4px solid var(--accent); }
        .user-anna .highlight { border-left: 4px solid var(--anna-accent); }

        .goal-info { font-size: 0.8rem; color: var(--target-color); display: flex; justify-content: space-between; }
        .eta-info { font-size: 0.75rem; color: var(--date-color); text-align: right; font-style: italic; }
    </style>
</head>
<body class="user-artem" id="body-tag">

    <div class="moscow-clock">
        <span class="time" id="mow-time">00:00:00</span>
        <span class="label">Москва UTC+3 — <span id="mow-date">...</span></span>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-user="artem" onclick="switchUser('artem')">Артем</button>
        <button class="tab-btn" data-user="anna" onclick="switchUser('anna')">Анна</button>
    </div>

    <div class="container" id="counters-container"></div>

    <script>
        const users = {
            artem: {
                name: "Артем",
                start: new Date(Date.UTC(2007, 6, 9, 8, 45, 0)), // 9 июля 2007 11:45 МСК
                color: "#38bdf8"
            },
            anna: {
                name: "Анна",
                start: new Date(Date.UTC(2002, 10, 15, 20, 45, 0)), // 15 ноября 2002 23:45 МСК
                color: "#f472b6"
            }
        };

        let currentUser = 'artem';

        const configs = [
            { id: 'seconds', label: 'Секунды', step: 100000000, ms: 1000 },
            { id: 'minutes', label: 'Минуты',  step: 10000000,  ms: 60000 },
            { id: 'hours',   label: 'Часы',     step: 100000,    ms: 3600000 },
            { id: 'days',    label: 'Дни',      step: 1000,      ms: 86400000 },
            { id: 'weeks',   label: 'Недели',   step: 100,       ms: 604800000 },
            { id: 'months',  label: 'Месяцы',   step: 100,       ms: 2629746000 },
            { id: 'years',   label: 'Лет',      step: 10,        ms: 31557600000 }
        ];

        function initLayout() {
            const container = document.getElementById('counters-container');
            container.innerHTML = '';
            configs.forEach(conf => {
                container.innerHTML += `
                    <div class="stat-card ${conf.id === 'seconds' ? 'highlight' : ''}">
                        <div class="row-main">
                            <div class="label">${conf.label}</div>
                            <div id="${conf.id}-val" class="value">0</div>
                        </div>
                        <div class="progress-bar-bg">
                            <div id="${conf.id}-progress" class="progress-fill"></div>
                        </div>
                        <div class="goal-info">
                            <span id="${conf.id}-goal-text">цель - 0</span>
                            <span id="${conf.id}-percent">0%</span>
                        </div>
                        <div class="eta-info" id="${conf.id}-eta">...</div>
                    </div>
                `;
            });
        }

        function switchUser(userId) {
            currentUser = userId;
            document.getElementById('body-tag').className = 'user-' + userId;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-user') === userId);
            });
            update();
        }

        function update() {
            const now = new Date();
            const user = users[currentUser];
            
            // Время МСК
            document.getElementById('mow-time').textContent = now.toLocaleTimeString('ru-RU', { timeZone: 'Europe/Moscow' });
            document.getElementById('mow-date').textContent = now.toLocaleDateString('ru-RU', { timeZone: 'Europe/Moscow', day: 'numeric', month: 'short' });

            const diffMs = now - user.start;

            configs.forEach(conf => {
                const currentVal = Math.floor(diffMs / conf.ms);
                let nextGoal = Math.ceil((currentVal + 1) / conf.step) * conf.step;
                if (nextGoal === 0) nextGoal = conf.step;

                const percent = Math.min(((currentVal / nextGoal) * 100), 100).toFixed(1);
                const etaDate = new Date(user.start.getTime() + (nextGoal * conf.ms));
                const etaStr = etaDate.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

                document.getElementById(`${conf.id}-val`).textContent = currentVal.toLocaleString('ru-RU');
                document.getElementById(`${conf.id}-goal-text`).textContent = `цель - ${nextGoal.toLocaleString('ru-RU')}`;
                document.getElementById(`${conf.id}-percent`).textContent = `${percent}%`;
                document.getElementById(`${conf.id}-progress`).style.width = `${percent}%`;
                document.getElementById(`${conf.id}-eta`).textContent = `Достижение: ${etaStr}`;
            });
        }

        initLayout();
        setInterval(update, 1000);
        update();
    </script>
</body>
</html>
